<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Farm Planner</title>
  <link rel="stylesheet" href="style.css">
  <script src="staticData.js"></script>
  <script src="app.js" defer></script>
  
</head>
<body>

  <header>
    <h1>Genshin Impact Farm Planner</h1>
    <p>Keep track of your active domain farm goals across the week</p>
  </header>

  <div class="container">
    <!-- Left Column: Settings and Input Form -->
    <div class="sidebar">
      <div class="panel">
        <h2>Add Item to Farm</h2>
        <form id="farmForm">
          <!-- Item Name -->
          <div class="form-group">
            <label for="itemName">Item Name</label>
            <input list="predefinedItems" type="text" id="itemName" class="form-control" placeholder="e.g. Teachings of Admonition" required>
            <datalist id="predefinedItems"></datalist>
          </div>

          <!-- Parent / Drop Group ID (maps to active days) -->
          <div class="form-group">
            <label for="farmSchedule">Farm Schedule</label>
            <input class="form-control" list="farmSchedules" id="farmSchedule" name="farmSchedule">
            <datalist id="farmSchedules"></datalist>
          </div>

          <!-- Amounts Required and Owned -->
          <div class="form-group qty-row">
            <div>
              <label for="amtOwned">Amt Owned</label>
              <input type="number" id="amtOwned" class="form-control" min="0" value="0" required>
            </div>
            <div>
              <label for="amtNeeded">Amt Needed</label>
              <input type="number" id="amtNeeded" class="form-control" min="1" value="1" required>
            </div>
          </div>

          <button type="button" class="btn" id="addToPlannerButton">Add to Planner</button>
        </form>
      </div>

      <!-- Current Items Tracked -->
      <div class="panel" style="margin-top: 1.5rem;">
        <h2>My Items</h2>
        <div class="form-group">
          <label for="search-input">Search:</label>
          <input class="form-control" type="text" name="search-input" id="search-input">
        </div>
        <div id="farmItemsList" class="farm-items-list">
          <!-- Items will render dynamically here -->
            <div class="farm-item-card">
                <div class="info">
                    <h4>Item Name</h4>
                    <p>Progress: 0/1</p>
                </div>
            </div>
            <div class="farm-item-card">
                <div class="info">
                    <h4>Item Name</h4>
                    <p>Progress: 0/10</p>
                </div>
            </div>          
        </div>
      </div>
    </div>

    <!-- Right Column: Weekly Schedule Grid -->
    <div class="main-content">
      <div class="panel">
        <h2>Weekly Farming Rotations</h2>
        <div id="weekGrid" class="week-grid">
          <!-- 7 days of the week will render here -->
           <div class="day-column">
            <h3>Sunday</h3>
              <div class="day-list">
                <div class="schedule-item">
                    <strong>Item Name</strong>
                    <div class="qty-badge">Needed: 0/10</div>
                </div>

                <div class="schedule-item">
                    <strong>Item Name 2</strong>
                    <div class="qty-badge">Needed 0/100</div>
                </div>

              </div>
           </div>
        </div>
      </div>
      <dialog id="item-conversion-dialog">
        <div class="panel">
          <h2 id="item-conversion-tier-1-name">Tier 01 Item</h2>
          <div class="qty-row">
            <div class="form-group">
              <label for="item-conversion-tier-1-amount-owned">Tier 01 Owned:</label>
              <input type="number" id="item-conversion-tier-1-amount-owned" name="item-conversion-tier-1-amount-owned" class="form-control" value="0" placeholder="0" min="0">
            </div>
            <div class="form-group">
              <label for="item-conversion-tier-1-amount-required">Tier 01 Required: </label>
              <input type="number" id="item-conversion-tier-1-amount-required" name="item-conversion-tier-1-amount-required" class="form-control" value="0" placeholder="0" min="0">
            </div>
          </div>
          <h2 id="item-conversion-tier-2-name">Tier 02 Item</h2>
          <div class="qty-row">
              <div class="form-group">
                <label for="item-conversion-tier-2-amount-owned">Tier 02 Owned:</label>
                <input type="number" id="item-conversion-tier-2-amount-owned" name="item-conversion-tier-2-amount-owned" class="form-control" value="0" placeholder="0" min="0">
              </div>
              <div class="form-group">
                <label for="item-conversion-tier-2-amount-required">Tier 02 Required:</label>
                <input type="number" id="item-conversion-tier-2-amount-required" name="item-conversion-tier-2-amount-required" class="form-control" value="0" placeholder="0" min="0">
              </div>
            </div>
          <h2 id="item-conversion-primary-item-name">Item Name</h2>
          <div class="qty-row">
            <div class="form-group">
              <label for="item-conversion-primary-item-owned" id="item-conversion-primary-item-label">Primary item Owned: </label>
              <input type="number" id="item-conversion-primary-item-owned" name="item-conversion-primary-item-owned" class="form-control" value="0" placeholder="0" min="0">
            </div>
            <div class="form-group">
              <label for="item-conversion-primary-item-required" id="item-conversion-primary-item-label">Primary item Required: </label>
              <input type="number" id="item-conversion-primary-item-required" name="item-conversion-primary-item-required" class="form-control" value="0" placeholder="0" min="0">
            </div>

          </div>
          <button type="button" id="item-conversion-close-button" class="form-control">Close Dialog</button>

        </div>
      </dialog>
    </div>
  </div>


</body>
</html>
